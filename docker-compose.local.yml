# Local-only override. Adds bundled Postgres and MinIO containers and wires
# api/voicebot to wait for it. Merged on top of docker-compose.yml via:
#
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up
#
# For managed Postgres (Neon, Supabase, RDS, etc.), omit this file and point
# DATABASE_URL at the managed connection string.

services:
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hail
      POSTGRES_PASSWORD: hail
      POSTGRES_DB: hail
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hail"]
      interval: 5s
      retries: 10

  api:
    depends_on:
      postgres:
        condition: service_healthy

  voicebot:
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  minio-data:
  postgres-data:
