# Local-only override. Adds a bundled Postgres container and wires
# api/voicebot to wait for it. Merged on top of docker-compose.yml via:
#
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up
#
# For managed Postgres (Neon, Supabase, RDS, etc.), omit this file and point
# DATABASE_URL at the managed connection string.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hail
      POSTGRES_PASSWORD: hail
      POSTGRES_DB: hail
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hail"]
      interval: 5s
      retries: 10

  api:
    depends_on:
      postgres:
        condition: service_healthy

  voicebot:
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
