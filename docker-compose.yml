name: hail

# Base stack. Local-dev focused: services build from source, ports publish to
# the host on 0.0.0.0 so they're reachable from a browser or another machine
# on the LAN.
#
# Two ways to layer on top:
#   • docker-compose.local.yml — adds a bundled Postgres container (dev).
#   • docker-compose.prod.yml  — adds Caddy as the TLS edge, pulls images
#                                from GHCR instead of building from source,
#                                and rebinds host ports to 127.0.0.1.
#
# Pick one or the other (or neither, if you bring your own managed Postgres
# and don't need ingress). See docs/operations.md → "Switching the database"
# and docs/setup/vm-deploy.md.

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file: .env
    ports:
      - "8080:8080"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/healthz').status==200 else 1)",
        ]
      interval: 5s
      retries: 10

  voicebot:
    build:
      context: .
      dockerfile: voicebot/Dockerfile
    env_file: .env
    environment:
      HAIL_API_URL: http://api:8080
    depends_on:
      api:
        condition: service_healthy

  mcp:
    build:
      context: .
      dockerfile: mcp/Dockerfile
    env_file: .env
    environment:
      HAIL_API_URL: http://api:8080
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8081:8081"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8081/healthz').status==200 else 1)",
        ]
      interval: 5s
      retries: 10

volumes:
  minio-data:
