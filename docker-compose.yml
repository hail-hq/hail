name: hail

# Base stack. Local-dev focused: services build from source, ports publish to
# the host on 0.0.0.0 so they're reachable from a browser or another machine
# on the LAN.
#
# Two ways to layer on top:
#   • docker-compose.local.yml — adds a bundled Postgres container (dev).
#   • docker-compose.prod.yml  — adds Caddy as the TLS edge, pulls images
#                                from GHCR instead of building from source,
#                                and rebinds host ports to 127.0.0.1.
#
# Pick one or the other (or neither, if you bring your own managed Postgres
# and don't need ingress). See docs/public/self-host/operations.md → "Switching the database"
# and docs/public/self-host/vm-deploy.md.

services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file: .env
    ports:
      - "8080:8080"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/healthz').status==200 else 1)",
        ]
      interval: 5s
      retries: 10

  # Internal operations only. Opt in with COMPOSE_PROFILES=activity-digest.
  # Build from the API source. No website request or GitHub cron runs it.
  activity-digest:
    profiles: [activity-digest]
    build:
      context: .
      dockerfile: api/Dockerfile
    command: [python, -m, hailhq.api.activity_digest]
    stop_grace_period: 130s
    mem_limit: 256m
    cpus: 0.25
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      HAIL_ACTIVITY_DIGEST_ENABLED: ${HAIL_ACTIVITY_DIGEST_ENABLED:-false}
      HAIL_ACTIVITY_DIGEST_API_URL: http://api:8080/v1
      HAIL_ACTIVITY_DIGEST_API_KEY: ${HAIL_ACTIVITY_DIGEST_API_KEY:-}
      HAIL_ACTIVITY_DIGEST_FROM: ${HAIL_ACTIVITY_DIGEST_FROM:-}
      HAIL_ACTIVITY_DIGEST_TO: ${HAIL_ACTIVITY_DIGEST_TO:-}
    depends_on:
      api:
        condition: service_healthy

  voicebot:
    build:
      context: .
      dockerfile: voicebot/Dockerfile
    env_file: .env
    environment:
      HAIL_API_URL: http://api:8080
    depends_on:
      api:
        condition: service_healthy

  mcp:
    build:
      context: .
      dockerfile: mcp/Dockerfile
    env_file: .env
    environment:
      HAIL_API_URL: http://api:8080
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8081:8081"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8081/healthz').status==200 else 1)",
        ]
      interval: 5s
      retries: 10
