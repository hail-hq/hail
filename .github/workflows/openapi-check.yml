name: openapi-check

on:
  pull_request:
    paths:
      - "api/**"
      - "openapi/openapi.yaml"
      - ".github/workflows/openapi-check.yml"

concurrency:
  group: openapi-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Verify openapi.yaml matches the code
        run: |
          set -euo pipefail
          # Regenerate the spec from the live routes and compare it
          # SEMANTICALLY (parsed objects, not text) against the committed
          # file. Formatter-agnostic: a spec-neutral api/ change produces an
          # identical spec and passes; a real route change that forgot to
          # regenerate openapi.yaml fails.
          uv sync --all-packages --all-extras
          uv run --directory api python - <<'PY'
          import json, sys, yaml
          from hailhq.api.main import app

          committed = yaml.safe_load(open("../openapi/openapi.yaml"))
          generated = json.loads(json.dumps(app.openapi()))
          if committed != generated:
              print(
                  "::error::openapi/openapi.yaml is stale — regenerate it in "
                  "this PR (see docs/public/contributing.md)."
              )
              sys.exit(1)
          print("openapi.yaml gate OK")
          PY
