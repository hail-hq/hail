name: Postman collections

on:
  pull_request:
    paths:
      - "openapi/openapi.yaml"
      - "postman/**"
      - "scripts/postman/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/postman.yml"
  push:
    branches: [main]
    paths:
      - "openapi/openapi.yaml"
      - "postman/**"
      - "scripts/postman/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/postman.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Update the existing Postman collection (main only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: postman-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collections:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: corepack enable
      # Install only the root workspace's tools, not web or docs-site.
      - run: pnpm install --frozen-lockfile --filter hail-hq
      - run: pnpm postman:test
      - run: pnpm postman:generate
      - uses: actions/upload-artifact@v4
        with:
          name: hail-postman-collections
          path: postman/*.postman_collection.json
      - name: Update the existing public collection
        if: >-
          github.ref == 'refs/heads/main' &&
          ((github.event_name == 'push' && vars.POSTMAN_AUTO_SYNC == 'true') ||
          (github.event_name == 'workflow_dispatch' && inputs.publish))
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
          POSTMAN_COLLECTION_UID: ${{ vars.POSTMAN_COLLECTION_UID }}
        run: pnpm postman:publish
