name: Deploy

# Builds the three service images on push to main, pushes them to GHCR, and
# SSHes the production VM to pull + roll them.
#
# Required repo secrets:
#   DEPLOY_SSH_HOST          — VM hostname or IP
#   DEPLOY_SSH_USER          — SSH user (must be in the docker group)
#   DEPLOY_SSH_PRIVATE_KEY   — private key authorised on the VM
#   DEPLOY_SSH_PORT          — (optional) SSH port; defaults to 22
#
# Optional repo variables (Settings → Actions → Variables):
#   DEPLOY_PATH              — repo checkout on the VM; defaults to /opt/hail
#
# Image tagging: every build pushes `latest` + `sha-<commit>`. The VM pulls
# `:latest` (hard-coded in docker-compose.yml); the SHA tag is for forensics
# and manual rollback (`docker pull ghcr.io/hail-hq/hail-api:sha-<commit>`
# then re-tag as :latest and restart).
#
# Security notes:
#   - All `github.*` interpolations land in env: blocks; the remote script
#     reads them as "$VARS" only. No untrusted string is interpolated into
#     a run: command.
#
# See docs/public/self-host/vm-deploy.md for the VM-side bootstrap.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build & push ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        service: [api, voicebot, mcp]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          # Canonical repo is hail-hq/hail; the compose file hard-codes the
          # same namespace. Forks need to override both.
          images: ghcr.io/hail-hq/hail-${{ matrix.service }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy to VM
    needs: build
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_GITHUB_ACTOR: ${{ github.actor }}
      DEPLOY_GITHUB_SHA: ${{ github.sha }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/hail' }}
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT }}
          envs: DEPLOY_GITHUB_TOKEN,DEPLOY_GITHUB_ACTOR,DEPLOY_GITHUB_SHA,DEPLOY_PATH
          # The VM keeps $DEPLOY_PATH as a checkout of this repo so the
          # compose file + Caddyfile stay in sync with the deployed commit.
          # We fetch, check out the exact SHA, log in to GHCR, run alembic,
          # then swap the running containers for fresh `:latest` images.
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"
            git fetch origin
            git checkout --detach "$DEPLOY_GITHUB_SHA"
            echo "$DEPLOY_GITHUB_TOKEN" | docker login ghcr.io -u "$DEPLOY_GITHUB_ACTOR" --password-stdin
            COMPOSE="docker compose -f docker-compose.yml -f docker-compose.prod.yml"
            $COMPOSE pull

            # Migration safety. See docs/public/operations.md → "Migration discipline".
            # alembic current + --sql print the diff in the deploy log before
            # anything mutates. Statement and lock timeouts are set inside
            # env.py via SET LOCAL (so they survive Neon/PgBouncer-style
            # transaction pooling, which rejects libpq PGOPTIONS at startup).
            echo "=== current schema revision ==="
            $COMPOSE run --rm api alembic current
            # Best-effort preview: --sql runs in Alembic's offline mode, which
            # has no live DB connection. Any migration with a runtime
            # data-dependent guard (a real SELECT via op.get_bind()) throws
            # there and aborts the preview early — expected, not a deploy
            # failure. Stderr is folded into the same pipe as stdout so that
            # a traceback gets bounded by head -200 like normal output does,
            # instead of dumping unbounded into the log.
            echo "=== migrations to apply (dry-print, best-effort) ==="
            $COMPOSE run --rm api alembic upgrade head --sql 2>&1 | head -200 || true
            echo "=== applying ==="
            $COMPOSE run --rm api alembic upgrade head

            $COMPOSE up -d --remove-orphans

            # Stale-image gate. `pull` + `up -d` can silently keep an old
            # build running (cached layer, registry hiccup, a service that
            # fails to recreate) while the deploy still reports success. For
            # each service, pull the exact sha-<commit> tag and assert the
            # running container's image ID matches it. Both :latest and
            # sha-<sha> point at the same image within a build, and
            # concurrency:deploy-prod serializes deploys so they cannot
            # diverge. A mismatch exits non-zero and fails the deploy red.
            assert_fresh() {
              svc="$1"
              docker pull -q "ghcr.io/hail-hq/hail-$svc:sha-$DEPLOY_GITHUB_SHA"
              cid="$($COMPOSE ps -q "$svc")"
              [ -n "$cid" ] || { echo "::error::$svc has no running container"; exit 1; }
              running="$(docker inspect --format '{{.Image}}' "$cid")"
              expected="$(docker image inspect --format '{{.Id}}' \
                "ghcr.io/hail-hq/hail-$svc:sha-$DEPLOY_GITHUB_SHA")"
              if [ "$running" != "$expected" ]; then
                echo "::error::$svc is stale — running $running, expected $expected (sha-$DEPLOY_GITHUB_SHA)"
                exit 1
              fi
              echo "$svc: fresh ($expected)"
            }
            for svc in api voicebot mcp; do assert_fresh "$svc"; done

            $COMPOSE ps

            # Restore main so operators SSHing the VM see a normal branch
            # state. Deploy work above ran against the detached SHA; this
            # only moves the symbolic ref. Skip if origin/main moved past
            # the deployed SHA mid-flight so the tree stays in lockstep
            # with the image rolled.
            if [ "$(git rev-parse origin/main)" = "$DEPLOY_GITHUB_SHA" ]; then
              git checkout main
            fi
