name: CI

on:
  pull_request:
    # A PR that changes only these files runs nothing here: no job lints,
    # tests or builds them. core/tests/test_deploy_paths.py fails if this
    # list covers Python, TOML or lock files, costs/, cli/, openapi/, or any
    # file an image copies.
    # A skipped run reports no checks, so a required check on main would
    # block these PRs forever: drop this list before requiring a CI job.
    paths-ignore:
      - "**/*.md"
      - "**/*.tf"
      - "**/*.hcl"
      - "docs-site/**"
      - "web/**"
      - "shared/**"
      - "postman/**"
      - "scripts/postman/**"
      - ".agents/**"
      - ".cursor-plugin/**"
  # The deployment workflow runs these checks for its exact main commit.
  workflow_call:

# Only superseded PR runs are cancelled; main pushes keep their own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          enable-cache: false
      # Pinned: ruff 0.17.0 (2026-10-09) adds auto-fix rules that fail the whole
      # tree; bump deliberately with a formatting-only PR.
      - run: uvx ruff==0.16.10 check .
      - run: uvx black==26.10.0 --check .

  python-tests:
    name: Python tests (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package: [core, api, voicebot, sdk, mcp]
    services:
      postgres:
        # pgvector for the knowledge base; same image as docker-compose.local.yml.
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_USER: hail
          POSTGRES_PASSWORD: hail
          POSTGRES_DB: hail
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hail"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          enable-cache: false
      - run: uv sync --frozen --all-packages --all-extras
      - name: Run tests
        working-directory: ${{ matrix.package }}
        run: uv run --frozen pytest tests -v --durations=20
        env:
          DATABASE_URL: postgresql+psycopg://hail:hail@localhost:5432/hail
      # Operator scripts (scripts/ops) import hailhq.core, so they run with core.
      - name: Run ops script tests
        if: matrix.package == 'core'
        run: uv run --frozen pytest scripts/ops -v

  # One check that sums up every Python suite (none is required on main today).
  test:
    if: ${{ always() }}
    needs: python-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every Python suite to pass
        env:
          RESULT: ${{ needs.python-tests.result }}
        run: test "$RESULT" = success

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - working-directory: cli
        run: |
          go vet ./...
          go test ./...
          go build ./...

  docker:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: hail-ci
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker compose build api voicebot mcp
      - name: Start MCP with production dependencies
        run: |
          docker run --rm --network none -i \
            -e HAIL_API_KEY=hl_live_test hail-ci-mcp python - <<'PY'
          from hailhq.mcp.server import app
          from starlette.testclient import TestClient

          with TestClient(app) as client:
              response = client.get("/healthz")
              assert response.status_code == 200, response.text
          PY
