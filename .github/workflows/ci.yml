name: CI

on:
  push:
    branches: [main]
  pull_request:

# Only superseded PR runs are cancelled; main pushes keep their own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          enable-cache: false
      # Pinned: ruff 0.17.0 (2026-10-09) adds auto-fix rules that fail the whole
      # tree; bump deliberately with a formatting-only PR.
      - run: uvx ruff==0.16.10 check .
      - run: uvx black==26.10.0 --check .

  python-tests:
    name: Python tests (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package: [core, api, voicebot, sdk, mcp]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hail
          POSTGRES_PASSWORD: hail
          POSTGRES_DB: hail
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hail"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          enable-cache: false
      - run: uv sync --frozen --all-packages --all-extras
      - name: Run tests
        working-directory: ${{ matrix.package }}
        run: uv run --frozen pytest tests -v --durations=20
        env:
          DATABASE_URL: postgresql+psycopg://hail:hail@localhost:5432/hail

  # Preserve the existing required check while the suites run in parallel.
  test:
    if: ${{ always() }}
    needs: python-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every Python suite to pass
        env:
          RESULT: ${{ needs.python-tests.result }}
        run: test "$RESULT" = success

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - working-directory: cli
        run: |
          go vet ./...
          go test ./...
          go build ./...

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker compose build api voicebot mcp
