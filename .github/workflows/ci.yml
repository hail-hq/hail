name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      # Pinned: unpinned uvx resolves the latest release, and a linter
      # upgrade (ruff 0.16.0, 2026-07) changed defaults and broke lint on
      # untouched code. Keep in lockstep with .lintstagedrc.js and the
      # workspace dev dependency.
      - run: uvx ruff@0.15.12 check .
      - run: uvx black@26.5.1 --check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hail
          POSTGRES_PASSWORD: hail
          POSTGRES_DB: hail
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hail"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - run: uv sync --all-packages --all-extras
      - name: core tests
        working-directory: core
        run: uv run pytest tests -v
        env:
          DATABASE_URL: postgresql+psycopg://hail:hail@localhost:5432/hail
      - name: api tests
        working-directory: api
        run: uv run pytest tests -v
        env:
          DATABASE_URL: postgresql+psycopg://hail:hail@localhost:5432/hail
      - name: sdk tests
        working-directory: sdk
        run: uv run pytest tests -v

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - working-directory: cli
        run: |
          go vet ./...
          go test ./...
          go build ./...

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker compose build api voicebot mcp
