name: CI

on:
  pull_request:
  # The deployment workflow runs these checks for its exact main commit.
  workflow_call:

# Only superseded PR runs are cancelled; main pushes keep their own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          enable-cache: false
      # Pinned: ruff 0.17.0 (2026-10-09) adds auto-fix rules that fail the whole
      # tree; bump deliberately with a formatting-only PR.
      - run: uvx ruff==0.16.10 check .
      - run: uvx black==26.10.0 --check .

  python-tests:
    name: Python tests (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package: [core, api, voicebot, sdk, mcp]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hail
          POSTGRES_PASSWORD: hail
          POSTGRES_DB: hail
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hail"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          enable-cache: false
      - run: uv sync --frozen --all-packages --all-extras
      - name: Run tests
        working-directory: ${{ matrix.package }}
        run: uv run --frozen pytest tests -v --durations=20
        env:
          DATABASE_URL: postgresql+psycopg://hail:hail@localhost:5432/hail

  # Production can reach Postgres through a transaction-mode pooler. This job
  # runs the app's queries and every migration through one: PgBouncer with
  # prepared-statement tracking off, like a hosted shared pooler.
  transaction-pooler:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hail
          POSTGRES_PASSWORD: hail
          POSTGRES_DB: hail
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hail"
          --health-interval 5s
          --health-retries 10
    env:
      HAIL_TEST_TRANSACTION_POOLER_URL: postgresql://hail:hail@127.0.0.1:6432/hail
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          enable-cache: false
      - run: uv sync --frozen --all-packages --all-extras
      - name: Start PgBouncer in transaction mode
        run: scripts/ci/start-transaction-pooler.sh
      - name: Queries through the pooler
        working-directory: core
        run: uv run --frozen pytest tests/test_transaction_pooler.py -v
      - name: Migrations through the pooler
        working-directory: api
        run: uv run --frozen pytest tests/test_migrations.py -v -k transaction_pooler

  # Preserve the existing required check while the suites run in parallel.
  test:
    if: ${{ always() }}
    needs: [python-tests, transaction-pooler]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every Python suite to pass
        env:
          SUITES: ${{ needs.python-tests.result }}
          POOLER: ${{ needs.transaction-pooler.result }}
        run: test "$SUITES" = success && test "$POOLER" = success

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - working-directory: cli
        run: |
          go vet ./...
          go test ./...
          go build ./...

  docker:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: hail-ci
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker compose build api voicebot mcp
      - name: Start MCP with production dependencies
        run: |
          docker run --rm --network none -i \
            -e HAIL_API_KEY=hl_live_test hail-ci-mcp python - <<'PY'
          from hailhq.mcp.server import app
          from starlette.testclient import TestClient

          with TestClient(app) as client:
              response = client.get("/healthz")
              assert response.status_code == 200, response.text
          PY
