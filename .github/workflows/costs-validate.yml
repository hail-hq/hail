name: costs-validate

on:
  pull_request:
    paths:
      - "costs/**"
      - "scripts/costs/**"
      - ".github/workflows/costs-validate.yml"

concurrency:
  group: costs-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install check-jsonschema
        run: pip install check-jsonschema==0.29.4
      # Every costs/*.json must have a matching costs/schema/<name>.schema.json.
      # Discovery mirrors check-stale.mjs: a new dataset without a schema fails
      # here instead of silently shipping unvalidated.
      - name: Validate costs data against schemas
        run: |
          for f in costs/*.json; do
            name=$(basename "$f" .json)
            schema="costs/schema/$name.schema.json"
            if [ ! -f "$schema" ]; then
              echo "::error file=$f::missing schema $schema"
              exit 1
            fi
            check-jsonschema --schemafile "$schema" "$f"
          done
      # Cross-field checks below are model-shaped (aliases, replaced_by_model_id)
      # and apply only to llm/stt/tts. telephony.json has no models[] and is
      # covered by its own schema validation step above.
      - name: Cross-field validity checks (aliases unique, replaced_by_model_id resolves)
        run: |
          for f in costs/llm.json costs/stt.json costs/tts.json; do
            dupes=$(jq -r '[.models[] | .aliases // [] | .[]] | group_by(.) | map(select(length > 1) | .[0])' "$f")
            if [ "$dupes" != "[]" ]; then
              echo "::error file=$f::duplicate aliases: $dupes"
              exit 1
            fi
            unresolved=$(jq -r '
              (.models | map(.model_id)) as $ids
              | [.models[] | select(.replaced_by_model_id != null) | select((.replaced_by_model_id as $r | $ids | index($r)) == null) | .model_id]
            ' "$f")
            if [ "$unresolved" != "[]" ]; then
              echo "::error file=$f::replaced_by_model_id does not resolve: $unresolved"
              exit 1
            fi
          done
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Costs script unit tests
        run: node --test "scripts/costs/*.test.mjs"
      - name: Featured set guard
        run: node scripts/costs/check-featured.mjs
