name: costs-refresh

# Weekly refresh of the model and SMS price rows, per
# docs/operations/refresh-costs.md. Claude Code reads vendor pricing pages,
# edits costs/*.json, and a second job opens a PR for a person to review.
#
# Required repo secret:
#   ANTHROPIC_API_KEY   a dedicated key with a low monthly spend limit
#
# Security notes:
#   - The agent reads untrusted web pages. It has no shell, it can edit only
#     the four data files, and WebFetch reaches only the vendor sites listed
#     in .github/prompts/costs-refresh-settings.json. WebSearch stays open.
#   - Only the agent step and the secret check see the key. The job has a
#     read-only token, and the checkout keeps no credentials.
#   - Only the diff of the four data files leaves the job. The job that can
#     write to the repo never runs the agent.
#   - The PR body comes from the agent, so it gets a warning line and its
#     @mentions are neutralized.
#   - The budget and the agent timeout cap the cost of one run. The job limit
#     is longer, so a timed-out run still exports what it finished.
on:
  schedule:
    - cron: "0 5 * * 1" # Mondays 05:00 UTC, before the number sync and stale check
  workflow_dispatch: {}

concurrency:
  group: costs-refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      ready: ${{ steps.export.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Check the secret is set
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY is not set (Settings → Secrets → Actions)"
            exit 1
          fi
      - name: Run the refresh
        id: agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          mkdir -p /tmp/out
          sed "s/{today}/$(date -u +%F)/g" .github/prompts/costs-refresh.md > /tmp/prompt.md
          # A budget stop or timeout exits non-zero. Keep going: the steps
          # below save the finished rows and fail the job at the end.
          set +e
          timeout --signal=INT 150m claude --safe-mode -p "$(cat /tmp/prompt.md)" \
            --model claude-sonnet-5-5 \
            --max-budget-usd 30 \
            --tools 'Read,Grep,Glob,Edit,WebFetch,WebSearch' \
            --settings .github/prompts/costs-refresh-settings.json \
            --permission-mode dontAsk \
            --permission-prompts none \
            --output-format json > /tmp/out/claude.json
          echo "exit=$?" >> "$GITHUB_OUTPUT"
      - name: Validate
        id: validate
        continue-on-error: true
        run: |
          pnpm exec prettier --write costs/llm.json costs/stt.json costs/tts.json costs/sms.json
          pnpm costs:validate
          pnpm costs:featured
          node --test scripts/costs/*.test.mjs
          for f in costs/llm.json costs/stt.json costs/tts.json; do
            dupes=$(jq -c '[.models[] | .aliases // [] | .[]] | group_by(.) | map(select(length > 1) | .[0])' "$f")
            unresolved=$(jq -c '(.models | map(.model_id)) as $ids | [.models[] | select(.replaced_by_model_id != null) | select((.replaced_by_model_id as $r | $ids | index($r)) == null) | .model_id]' "$f")
            if [ "$dupes" != "[]" ] || [ "$unresolved" != "[]" ]; then
              echo "::error file=$f::aliases: $dupes ; replaced_by: $unresolved"
              exit 1
            fi
          done
          pnpm site:build
      - name: Export the diff and the report
        id: export
        if: always()
        env:
          AGENT_EXIT: ${{ steps.agent.outputs.exit }}
          VALIDATE: ${{ steps.validate.outcome }}
        run: |
          mkdir -p /tmp/out
          git diff -- costs/llm.json costs/stt.json costs/tts.json costs/sms.json > /tmp/out/refresh.patch
          field() { jq -r "$1" /tmp/out/claude.json 2>/dev/null || echo "$2"; }
          is_error=$(field '.is_error // false' true)
          [ "$AGENT_EXIT" = "0" ] && [ "$is_error" = "false" ] && agent_ok=true || agent_ok=false
          {
            echo "> An agent wrote this report after reading untrusted web pages. Check the diff before you merge."
            echo
            if [ "$agent_ok" != "true" ]; then
              echo "**The agent did not finish** (exit ${AGENT_EXIT:-none}). This report can be missing, and some providers were not checked."
              echo
            fi
            echo "Rows with a new check date: $(grep -c '^+ *\"last_verified\"' /tmp/out/refresh.patch)."
            echo
            # Backticks stop an @name in the agent's text from notifying anyone.
            field '.result // "The run gave no report."' "The run gave no report." \
              | sed -E 's/(^|[^[:alnum:]`])@([[:alnum:]-]+)/\1`@\2`/g'
            echo
            echo "---"
            echo
            echo "Estimated cost: \$$(field '.total_cost_usd // 0' 0). Validation: ${VALIDATE}."
            echo
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > /tmp/out/summary.md
          cat /tmp/out/summary.md >> "$GITHUB_STEP_SUMMARY"
          echo "agent_ok=$agent_ok" >> "$GITHUB_OUTPUT"
          if [ "$VALIDATE" = "success" ] && [ -s /tmp/out/refresh.patch ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: costs-refresh
          path: /tmp/out/
          if-no-files-found: warn
          retention-days: 7
      - name: Fail the run if the agent or the checks failed
        if: always()
        env:
          AGENT_OK: ${{ steps.export.outputs.agent_ok }}
          VALIDATE: ${{ steps.validate.outcome }}
        run: |
          if [ "$AGENT_OK" != "true" ] || [ "$VALIDATE" != "success" ]; then
            echo "::error::Agent finished: ${AGENT_OK:-false}. Validation: ${VALIDATE:-skipped}."
            exit 1
          fi

  open-pr:
    needs: refresh
    # A failed refresh job can still hold valid rows, for example after a
    # budget stop. The failed run stays red so someone looks at it.
    if: always() && needs.refresh.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: costs-refresh
          path: /tmp/out
      - name: Apply the diff
        id: apply
        run: |
          git apply /tmp/out/refresh.patch
          echo "today=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Open PR
        uses: peter-evans/create-pull-request@v6
        with:
          branch: costs/weekly-refresh
          base: main
          add-paths: |
            costs/llm.json
            costs/stt.json
            costs/tts.json
            costs/sms.json
          title: "feat(costs): weekly refresh ${{ steps.apply.outputs.today }}"
          commit-message: "feat(costs): weekly refresh ${{ steps.apply.outputs.today }}"
          body-path: /tmp/out/summary.md
          labels: costs-refresh
          # The review request is what sends the email: GitHub does not
          # notify anyone about a bot's new pull request on its own.
          reviewers: r13i
