# TEMPORARY: measures the knowledge embedding model on a real x86 runner for
# the PR description. Removed before the PR is marked ready.
name: knowledge-bench
on:
  pull_request:
    paths: [".github/workflows/knowledge-bench.yml"]
jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          enable-cache: false
      - run: uv sync --frozen --all-packages --all-extras
      - name: CPU
        run: |
          lscpu | grep -E "Model name|^CPU\(s\)"
          grep -o -E 'avx2|avx512f|avx512_vnni|avx_vnni' /proc/cpuinfo | sort -u
      - name: Fetch models
        run: |
          set -e
          R=https://huggingface.co/intfloat/multilingual-e5-small/resolve/614241f622f53c4eeff9890bdc4f31cfecc418b3
          mkdir -p m/int8 m/fp32
          curl -sL -o m/int8/model.onnx $R/onnx/model_qint8_avx512_vnni.onnx
          curl -sL -o m/fp32/model.onnx $R/onnx/model.onnx
          curl -sL -o m/int8/sentencepiece.bpe.model $R/sentencepiece.bpe.model
          cp m/int8/sentencepiece.bpe.model m/fp32/
          sha256sum m/int8/* m/fp32/*
      - name: Selftest (int8, fp32)
        working-directory: core
        run: |
          uv run --frozen python -m hailhq.core.knowledge.selftest ../m/int8
          uv run --frozen python -m hailhq.core.knowledge.selftest ../m/fp32
      - name: Measure
        working-directory: core
        run: |
          uv run --frozen python - <<'PY'
          import time, numpy as np
          from hailhq.core.knowledge.embed import Embedder
          from hailhq.core.knowledge.selftest import SECTIONS, QUESTIONS
          def rss():
              return int(open("/proc/self/status").read().split("VmRSS:")[1].split()[0]) // 1024
          texts = [b for _, b in SECTIONS.values()] + [q for q, _ in QUESTIONS]
          long = " ".join(b for _, b in SECTIONS.values()) * 4
          out = {}
          for name in ("int8", "fp32"):
              base = rss()
              t = time.perf_counter(); e = Embedder(f"../m/{name}"); load = time.perf_counter() - t
              e.embed_query("warm up")
              loaded = rss()
              ts = []
              for i in range(200):
                  q = QUESTIONS[i % len(QUESTIONS)][0]
                  t = time.perf_counter(); e.embed_query(q); ts.append(time.perf_counter() - t)
              ts.sort()
              passages = [long[: 2000 + i] for i in range(64)]
              t = time.perf_counter(); e.embed_passages(passages); ingest = time.perf_counter() - t
              tokens = e.count_tokens(passages[0])
              out[name] = e.embed_passages(texts)
              print(f"{name}: load {load:.2f}s, RSS +{loaded - base} MB (total {loaded}), "
                    f"query p50 {ts[100]*1000:.1f} ms p95 {ts[190]*1000:.1f} ms, "
                    f"ingest {64/ingest:.1f} passages/s at ~{tokens} tokens, "
                    f"{1000*ingest/64:.0f} s per 1,000 pieces")
              del e
          cos = (out["int8"] * out["fp32"]).sum(axis=1)
          print(f"int8 vs fp32 cosine: min {cos.min():.4f} mean {cos.mean():.4f}")
          PY
