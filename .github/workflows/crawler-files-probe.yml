name: crawler-files-probe

on:
  schedule:
    # Daily at 07:15 UTC. Free-tier-friendly (~30 runs/month) and one
    # missed cycle is still well under Google's crawler revisit interval.
    - cron: "15 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe-apex:
    runs-on: ubuntu-latest
    steps:
      - name: Probe sitemap.xml
        run: |
          set -euo pipefail
          body=$(curl --fail --silent --show-error https://hail.so/sitemap.xml)
          size=${#body}
          echo "sitemap.xml: $size bytes"
          head -5 <<< "$body"
          [ "$size" -gt 100 ] || { echo "::error::sitemap.xml body too small ($size bytes)"; exit 1; }
          # Here-strings avoid SIGPIPE: grep -q exits at first match and
          # would close the pipe under `set -o pipefail`, failing the step.
          grep -q "<urlset" <<< "$body" || { echo "::error::sitemap.xml missing <urlset>"; exit 1; }
          grep -q "</urlset>" <<< "$body" || { echo "::error::sitemap.xml missing </urlset>"; exit 1; }
      - name: Probe costs sitemap.xml
        run: |
          set -euo pipefail
          body=$(curl --fail --silent --show-error https://hail.so/costs/sitemap.xml)
          size=${#body}
          echo "costs/sitemap.xml: $size bytes"
          head -5 <<< "$body"
          [ "$size" -gt 100 ] || { echo "::error::costs/sitemap.xml body too small ($size bytes)"; exit 1; }
          # Here-strings avoid SIGPIPE: grep -q exits at first match and
          # would close the pipe under `set -o pipefail`, failing the step.
          grep -q "<urlset" <<< "$body" || { echo "::error::costs/sitemap.xml missing <urlset>"; exit 1; }
          grep -q "</urlset>" <<< "$body" || { echo "::error::costs/sitemap.xml missing </urlset>"; exit 1; }
          grep -q "/costs/compare/" <<< "$body" || { echo "::error::costs/sitemap.xml missing /costs/compare/ entries"; exit 1; }
      - name: Probe llms.txt
        run: |
          set -euo pipefail
          body=$(curl --fail --silent --show-error https://hail.so/llms.txt)
          size=${#body}
          echo "llms.txt: $size bytes"
          head -5 <<< "$body"
          [ "$size" -gt 100 ] || { echo "::error::llms.txt body too small ($size bytes)"; exit 1; }
          head_lines=$(head -5 <<< "$body")
          grep -q "^# Hail" <<< "$head_lines" || { echo "::error::llms.txt missing # Hail header near top"; exit 1; }
      - name: Probe llms-full.txt
        run: |
          set -euo pipefail
          body=$(curl --fail --silent --show-error https://hail.so/llms-full.txt)
          size=${#body}
          echo "llms-full.txt: $size bytes"
          head -5 <<< "$body"
          [ "$size" -gt 100 ] || { echo "::error::llms-full.txt body too small ($size bytes)"; exit 1; }
          grep -q "<!-- source:" <<< "$body" || { echo "::error::llms-full.txt missing source markers"; exit 1; }
      - name: Probe robots.txt
        run: |
          set -euo pipefail
          body=$(curl --fail --silent --show-error https://hail.so/robots.txt)
          size=${#body}
          echo "robots.txt: $size bytes"
          printf '%s\n' "$body"
          [ "$size" -gt 30 ] || { echo "::error::robots.txt body too small ($size bytes)"; exit 1; }
          grep -q "Sitemap:" <<< "$body" || { echo "::error::robots.txt missing Sitemap"; exit 1; }
          grep -q "User-agent: \*" <<< "$body" || { echo "::error::robots.txt missing User-agent"; exit 1; }
