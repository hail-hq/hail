name: crawler-files-probe

on:
  schedule:
    # Daily at 07:15 UTC. Free-tier-friendly (~30 runs/month) and one
    # missed cycle is still well under Google's crawler revisit interval.
    - cron: "15 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe-apex:
    runs-on: ubuntu-latest
    steps:
      - name: Probe sitemap.xml
        run: |
          set -euo pipefail
          body=$(curl --fail --silent --show-error https://hail.so/sitemap.xml)
          size=${#body}
          echo "sitemap.xml: $size bytes"
          head -5 <<< "$body"
          [ "$size" -gt 100 ] || { echo "::error::sitemap.xml body too small ($size bytes)"; exit 1; }
          # Here-strings avoid SIGPIPE: grep -q exits at first match and
          # would close the pipe under `set -o pipefail`, failing the step.
          grep -q "<urlset" <<< "$body" || { echo "::error::sitemap.xml missing <urlset>"; exit 1; }
          grep -q "</urlset>" <<< "$body" || { echo "::error::sitemap.xml missing </urlset>"; exit 1; }
      - name: Probe costs sitemap.xml
        run: |
          set -euo pipefail
          body=$(curl --fail --silent --show-error https://hail.so/costs/sitemap.xml)
          size=${#body}
          echo "costs/sitemap.xml: $size bytes"
          head -5 <<< "$body"
          [ "$size" -gt 100 ] || { echo "::error::costs/sitemap.xml body too small ($size bytes)"; exit 1; }
          # Here-strings avoid SIGPIPE: grep -q exits at first match and
          # would close the pipe under `set -o pipefail`, failing the step.
          grep -q "<urlset" <<< "$body" || { echo "::error::costs/sitemap.xml missing <urlset>"; exit 1; }
          grep -q "</urlset>" <<< "$body" || { echo "::error::costs/sitemap.xml missing </urlset>"; exit 1; }
          grep -q "/costs/compare/" <<< "$body" || { echo "::error::costs/sitemap.xml missing /costs/compare/ entries"; exit 1; }
      - name: Probe llms.txt
        run: |
          set -euo pipefail
          body=$(curl --fail --silent --show-error https://hail.so/llms.txt)
          size=${#body}
          echo "llms.txt: $size bytes"
          head -5 <<< "$body"
          [ "$size" -gt 100 ] || { echo "::error::llms.txt body too small ($size bytes)"; exit 1; }
          head_lines=$(head -5 <<< "$body")
          grep -q "^# Hail" <<< "$head_lines" || { echo "::error::llms.txt missing # Hail header near top"; exit 1; }
      - name: Probe llms-full.txt
        run: |
          set -euo pipefail
          body=$(curl --fail --silent --show-error https://hail.so/llms-full.txt)
          size=${#body}
          echo "llms-full.txt: $size bytes"
          head -5 <<< "$body"
          [ "$size" -gt 100 ] || { echo "::error::llms-full.txt body too small ($size bytes)"; exit 1; }
          grep -q "<!-- source:" <<< "$body" || { echo "::error::llms-full.txt missing source markers"; exit 1; }
      - name: Probe robots.txt
        run: |
          set -euo pipefail
          body=$(curl --fail --silent --show-error https://hail.so/robots.txt)
          size=${#body}
          echo "robots.txt: $size bytes"
          printf '%s\n' "$body"
          [ "$size" -gt 30 ] || { echo "::error::robots.txt body too small ($size bytes)"; exit 1; }
          grep -q "Sitemap:" <<< "$body" || { echo "::error::robots.txt missing Sitemap"; exit 1; }
          grep -q "User-agent: \*" <<< "$body" || { echo "::error::robots.txt missing User-agent"; exit 1; }
      - name: Probe public agent discovery
        if: ${{ !cancelled() }}
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";

          async function readPublic(url, mediaType, { method = "GET", headers } = {}) {
            const request = `${method} ${url}`;
            const response = await fetch(url, {
              method,
              headers,
              redirect: "error",
              signal: AbortSignal.timeout(20_000),
            }).catch((cause) => {
              throw new Error(`${request} failed`, { cause });
            });
            assert.equal(response.status, 200, `${request} status`);
            const contentType = response.headers.get("content-type")?.split(";")[0].trim().toLowerCase();
            assert.equal(contentType, mediaType, `${request} content type`);
            return response;
          }

          const manifestUrl = "https://hail.so/.well-known/mcp.json";
          const manifestResponse = await readPublic(manifestUrl, "application/json", {
            headers: { Accept: "text/markdown" },
          });
          const manifest = await manifestResponse.json();
          assert.equal(manifest.name, "io.github.hail-hq/hail-mcp", "MCP registry name");
          const mcpEndpoint = new URL("https://mcp.hail.so");
          const hasMcpRemote = manifest.remotes?.some((remote) =>
            remote.type === "streamable-http" && new URL(remote.url).href === mcpEndpoint.href,
          );
          assert.ok(hasMcpRemote, "MCP streamable HTTP remote");
          await readPublic(manifestUrl, "application/json", { method: "HEAD" });
          console.log("MCP discovery manifest served as JSON on GET and HEAD");

          const skill = await readPublic("https://hail.so/skill.md", "text/markdown");
          const frontMatter = (await skill.text()).match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n/)?.[1];
          assert.match(frontMatter ?? "", /^name:[ \t]*hail[ \t]*\r?$/m, "Hail skill front matter");
          console.log("Hosted Hail skill served as Markdown");

          const api = await readPublic("https://api.hail.so/openapi.json", "application/json");
          const spec = await api.json();
          assert.match(spec.openapi ?? "", /^\d+\.\d+\.\d+$/, "OpenAPI version");
          assert.ok(Object.keys(spec.paths ?? {}).some((path) => path.startsWith("/")), "OpenAPI paths");
          console.log("OpenAPI document served as JSON with API paths");
          NODE
