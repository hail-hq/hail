components:
  schemas:
    CallCreate:
      properties:
        to:
          type: string
          title: To
        from:
          anyOf:
            - type: string
            - type: "null"
          title: From
        system_prompt:
          anyOf:
            - type: string
            - type: "null"
          title: System Prompt
        llm:
          anyOf:
            - $ref: "#/components/schemas/LLMConfig"
            - type: "null"
        first_message:
          anyOf:
            - type: string
            - type: "null"
          title: First Message
        voice_config:
          $ref: "#/components/schemas/VoiceConfig"
        conversation_id:
          anyOf:
            - type: string
              format: uuid
            - type: "null"
          title: Conversation Id
        metadata:
          additionalProperties: true
          type: object
          title: Metadata
      additionalProperties: false
      type: object
      required:
        - to
      title: CallCreate
    CallEventResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        call_id:
          type: string
          format: uuid
          title: Call Id
        kind:
          type: string
          title: Kind
        payload:
          additionalProperties: true
          type: object
          title: Payload
        occurred_at:
