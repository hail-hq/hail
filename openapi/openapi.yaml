      additionalProperties: false
      type: object
      title: EmailDomainPatch
      description:
        "Body for PATCH /email-domains/{id}.\n\nTwo clusters of mutable\
        \ fields:\n\n* Hail-mail addressing \u2014 the user/org prefix pair (only\
        \ valid on\n  ``kind='hail_mail'`` rows; the handler returns 422 if a tenant\
        \ tries\n  to PATCH these on a custom row).\n* Inbound action \u2014 ``inbound_enabled``\
        \ + at least one of ``forward_to``\n  / ``webhook_url`` + the optional ``forward_rate_per_hour``\
        \ cap. These\n  apply to either kind, but this milestone routes inbound only\
        \ to\n  ``hail_mail`` rows; custom-domain inbound (MX delegation) is the\n\
        \  next milestone.\n\nEvery field is independently optional so ``PATCH`` semantics\
        \ work the\nway callers expect: send only what you want to change. The route\n\
        enforces the cross-field rules (the CHECK constraint on the table\nrequires\
        \ an action when ``inbound_enabled`` is true) \u2014 we don't\nre-implement\
        \ it here because the patch may merge with existing row\nstate to satisfy\
        \ the invariant.\n\nNOTE: the plaintext webhook secret is NOT a PATCH field.\
        \ It's set at\ncreate time and rotated via a dedicated endpoint that returns\
        \ the new\nplaintext exactly once. ``webhook_secret_encrypted`` is server-managed\
        \ and\nnever accepted on the wire."
