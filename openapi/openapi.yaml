      parameters:
      - name: email_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Email Id
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
