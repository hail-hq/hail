components:
  schemas:
    Body_upload_email_attachment:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
      type: object
      required:
      - file
      title: Body_upload_email_attachment
    CallCreate:
      properties:
        recipient_consent:
          type: boolean
          title: Recipient Consent
          description: "Attestation that you have obtained the lawful consent required\
            \ to contact this recipient. Hail does not verify consent itself \u2014\
            \ you are responsible for a lawful basis under TCPA/ePrivacy/PECR/CAN-SPAM/GDPR\
            \ as applicable. Rejected (422) if not true."
        consent_source:
          anyOf:
          - type: string
          - type: 'null'
          title: Consent Source
          description: Where/how consent was obtained (e.g. 'signup form', 'prior
            customer relationship'). Required (non-empty) when message_type is 'marketing'.
        consent_obtained_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Consent Obtained At
          description: When consent was obtained, if known.
        message_type:
          type: string
          enum:
          - marketing
          - informational
          title: Message Type
          description: '''marketing'' additionally requires a non-empty consent_source.
            Use ''informational'' for transactional/service communications.'
          default: informational
        to:
          type: string
          title: To
        from:
          anyOf:
          - type: string
          - type: 'null'
          title: From
        system_prompt:
          anyOf:
          - type: string
          - type: 'null'
          title: System Prompt
        llm:
          anyOf:
          - $ref: '#/components/schemas/LLMConfig'
          - type: 'null'
        first_message:
          anyOf:
          - type: string
          - type: 'null'
          title: First Message
        voice_config:
          $ref: '#/components/schemas/VoiceConfig'
        conversation_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Conversation Id
        metadata:
          additionalProperties: true
          type: object
          title: Metadata
        tools:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Tools
          description: 'Agent tools to allow on this call. Omitted: every tool the
            organization''s configured channels support (new channels appear automatically).
            Empty list: no tools. Tool names are validated against the server''s registry.'
      additionalProperties: false
      type: object
      required:
      - recipient_consent
      - to
      title: CallCreate
    CallListResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/CallResponse'
          type: array
          title: Items
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
      type: object
      required:
      - items
      title: CallListResponse
    CallResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        organization_id:
          type: string
          format: uuid
          title: Organization Id
        conversation_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Conversation Id
        from_e164:
          type: string
          title: From E164
        to_e164:
          type: string
          title: To E164
        direction:
          type: string
          enum:
          - outbound
          - inbound
          title: Direction
        status:
          type: string
          enum:
          - queued
          - dialing
          - ringing
          - in_progress
          - completed
          - failed
          - busy
          - no_answer
          - canceled
          title: Status
        end_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: End Reason
        provider_call_sid:
          anyOf:
          - type: string
          - type: 'null'
          title: Provider Call Sid
        livekit_room:
          anyOf:
          - type: string
          - type: 'null'
          title: Livekit Room
        initial_prompt:
          anyOf:
          - type: string
          - type: 'null'
          title: Initial Prompt
        recording_s3_key:
          anyOf:
          - type: string
          - type: 'null'
          title: Recording S3 Key
        requested_at:
          type: string
          format: date-time
          title: Requested At
        started_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Started At
        answered_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Answered At
        ended_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Ended At
      type: object
      required:
      - id
      - organization_id
      - conversation_id
      - from_e164
      - to_e164
      - direction
      - status
      - end_reason
      - provider_call_sid
      - livekit_room
      - initial_prompt
      - recording_s3_key
      - requested_at
      - started_at
      - answered_at
      - ended_at
      title: CallResponse
    ContactCreate:
      properties:
