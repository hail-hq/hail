openapi: 3.1.0
info:
  title: Hail
  description:
    "Universal communication platform for AI agents.\n\nThis file is the\
    \ source of truth for the Go CLI. Regenerate it after\nchanging API routes \u2014\
    \ see docs/contributing.md.\n"
  version: 0.1.0
paths:
  /calls:
    post:
      tags:
        - calls
      summary: Create Call
      operationId: create_call_calls_post
      parameters:
        - name: authorization
          in: header
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            title: Authorization
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            title: Idempotency-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallCreate"
      responses:
        "201":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallResponse"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
    get:
      tags:
        - calls
      summary: List Calls
      operationId: list_calls_calls_get
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            title: Cursor
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            maximum: 200
            minimum: 1
            default: 50
            title: Limit
        - name: status
          in: query
          required: false
          schema:
            anyOf:
              - enum:
                  - queued
                  - dialing
                  - ringing
                  - in_progress
                  - completed
                  - failed
                  - busy
                  - no_answer
                  - canceled
                type: string
              - type: "null"
            title: Status
        - name: to
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            title: To
        - name: authorization
          in: header
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            title: Authorization
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallListResponse"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /calls/{call_id}:
    get:
      tags:
        - calls
      summary: Get Call
      operationId: get_call_calls__call_id__get
      parameters:
        - name: call_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Call Id
        - name: authorization
          in: header
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            title: Authorization
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallResponse"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /emails:
    post:
      tags:
        - emails
      summary: Create Email
      operationId: create_email_emails_post
      parameters:
        - name: authorization
          in: header
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            title: Authorization
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            title: Idempotency-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailCreate"
      responses:
        "201":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailResponse"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
    get:
      tags:
        - emails
      summary: List Emails
      operationId: list_emails_emails_get
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            title: Cursor
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            maximum: 200
            minimum: 1
            default: 50
            title: Limit
        - name: status
          in: query
          required: false
          schema:
            anyOf:
              - enum:
                  - queued
                  - sent
                  - failed
                  - bounced
                  - complained
                type: string
              - type: "null"
            title: Status
        - name: authorization
          in: header
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            title: Authorization
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailListResponse"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /emails/{email_id}:
    get:
      tags:
        - emails
      summary: Get Email
      operationId: get_email_emails__email_id__get
      parameters:
        - name: email_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Email Id
        - name: authorization
          in: header
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            title: Authorization
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailResponse"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /events:
    get:
      tags:
        - events
      summary: List Events
      operationId: list_events_events_get
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            title: Cursor
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            maximum: 1000
            minimum: 1
            default: 100
            title: Limit
        - name: id
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            title: Id
        - name: kind
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            title: Kind
        - name: authorization
          in: header
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            title: Authorization
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventStreamResponse"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /sender-domains:
    post:
      tags:
        - sender-domains
      summary: Create Sender Domain
      operationId: create_sender_domain_sender_domains_post
      parameters:
        - name: authorization
          in: header
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SenderDomainCreate"
      responses:
        "201":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SenderDomainResponse"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
    get:
      tags:
        - sender-domains
      summary: List Sender Domains
      operationId: list_sender_domains_sender_domains_get
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            title: Cursor
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            maximum: 200
            minimum: 1
            default: 50
            title: Limit
        - name: authorization
          in: header
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            title: Authorization
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SenderDomainListResponse"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /sender-domains/{domain_id}:
    get:
      tags:
        - sender-domains
      summary: Get Sender Domain
      operationId: get_sender_domain_sender_domains__domain_id__get
      parameters:
        - name: domain_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Domain Id
        - name: authorization
          in: header
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            title: Authorization
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SenderDomainResponse"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
    patch:
      tags:
        - sender-domains
      summary: Patch Sender Domain
      description:
        "Edit the user/org prefix on a hail-mail row.\n\nThe managed-cloud\
        \ console writes here when an org admin changes the\nvisible hail-mail address.\
        \ Self-hosted operators usually skip this\nendpoint and set the env-var defaults\
        \ instead, but the route works\nthe same way on both surfaces.\n\nOnly ``kind='hail_mail'``\
        \ rows accept edits \u2014 there's nothing in a\ncustom-domain row that the\
        \ tenant should be free to mutate via this\nsurface (DNS, DKIM, verification\
        \ state are provider-driven)."
      operationId: patch_sender_domain_sender_domains__domain_id__patch
      parameters:
        - name: domain_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Domain Id
        - name: authorization
          in: header
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SenderDomainPatch"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SenderDomainResponse"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
    delete:
      tags:
        - sender-domains
      summary: Delete Sender Domain
      operationId: delete_sender_domain_sender_domains__domain_id__delete
      parameters:
        - name: domain_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Domain Id
        - name: authorization
          in: header
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            title: Authorization
      responses:
        "204":
          description: Successful Response
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /sender-domains/{domain_id}/verify:
    post:
      tags:
        - sender-domains
      summary: Verify Sender Domain
      description:
        "Re-poll the email provider for the current verification status.\n\
        \nOn-demand only \u2014 there is no background poller in v1. Operators /\n\
        tenants hit this after publishing DNS to flip the row to ``verified``.\nHail-mail\
        \ rows are no-ops (they're already verified by construction)."
      operationId: verify_sender_domain_sender_domains__domain_id__verify_post
      parameters:
        - name: domain_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Domain Id
        - name: authorization
          in: header
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            title: Authorization
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SenderDomainResponse"
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /healthz:
    get:
      summary: Healthz
      operationId: healthz_healthz_get
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Healthz Healthz Get
components:
  schemas:
    CallCreate:
      properties:
        to:
          type: string
          title: To
        from:
          anyOf:
            - type: string
            - type: "null"
          title: From
        system_prompt:
          anyOf:
            - type: string
            - type: "null"
          title: System Prompt
        llm:
          anyOf:
            - $ref: "#/components/schemas/LLMConfig"
            - type: "null"
        first_message:
          anyOf:
            - type: string
            - type: "null"
          title: First Message
        voice_config:
          $ref: "#/components/schemas/VoiceConfig"
        conversation_id:
          anyOf:
            - type: string
              format: uuid
            - type: "null"
          title: Conversation Id
        metadata:
          additionalProperties: true
          type: object
          title: Metadata
      additionalProperties: false
      type: object
      required:
        - to
      title: CallCreate
    CallEventResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        call_id:
          type: string
          format: uuid
          title: Call Id
        kind:
          type: string
          title: Kind
        payload:
          additionalProperties: true
          type: object
          title: Payload
        occurred_at:
          type: string
          format: date-time
          title: Occurred At
      type: object
      required:
        - id
        - call_id
        - kind
        - payload
        - occurred_at
      title: CallEventResponse
    CallListResponse:
      properties:
        items:
          items:
            $ref: "#/components/schemas/CallResponse"
          type: array
          title: Items
        next_cursor:
          anyOf:
            - type: string
            - type: "null"
          title: Next Cursor
      type: object
      required:
        - items
      title: CallListResponse
    CallResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        organization_id:
          type: string
          format: uuid
          title: Organization Id
        conversation_id:
          anyOf:
            - type: string
              format: uuid
            - type: "null"
          title: Conversation Id
        from_e164:
          type: string
          title: From E164
        to_e164:
          type: string
          title: To E164
        direction:
          type: string
          enum:
            - outbound
            - inbound
          title: Direction
        status:
          type: string
          enum:
            - queued
            - dialing
            - ringing
            - in_progress
            - completed
            - failed
            - busy
            - no_answer
            - canceled
          title: Status
        end_reason:
          anyOf:
            - type: string
            - type: "null"
          title: End Reason
        provider_call_sid:
          anyOf:
            - type: string
            - type: "null"
          title: Provider Call Sid
        livekit_room:
          anyOf:
            - type: string
            - type: "null"
          title: Livekit Room
        initial_prompt:
          anyOf:
            - type: string
            - type: "null"
          title: Initial Prompt
        recording_s3_key:
          anyOf:
            - type: string
            - type: "null"
          title: Recording S3 Key
        requested_at:
          type: string
          format: date-time
          title: Requested At
        started_at:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
          title: Started At
        answered_at:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
          title: Answered At
        ended_at:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
          title: Ended At
      type: object
      required:
        - id
        - organization_id
        - conversation_id
        - from_e164
        - to_e164
        - direction
        - status
        - end_reason
        - provider_call_sid
        - livekit_room
        - initial_prompt
        - recording_s3_key
        - requested_at
        - started_at
        - answered_at
        - ended_at
      title: CallResponse
    DkimRecordSchema:
      properties:
        name:
          type: string
          title: Name
        value:
          type: string
          title: Value
        type:
          type: string
          const: CNAME
          title: Type
          default: CNAME
      additionalProperties: true
      type: object
      required:
        - name
        - value
      title: DkimRecordSchema
      description: One DNS CNAME the tenant must publish before SES verifies the domain.
    EmailCreate:
      properties:
        from:
          anyOf:
            - type: string
            - type: "null"
          title: From
        to:
          items:
            type: string
          type: array
          minItems: 1
          title: To
        cc:
          anyOf:
            - items:
                type: string
              type: array
            - type: "null"
          title: Cc
        bcc:
          anyOf:
            - items:
                type: string
              type: array
            - type: "null"
          title: Bcc
        reply_to:
          anyOf:
            - type: string
            - type: "null"
          title: Reply To
        subject:
          type: string
          maxLength: 998
          minLength: 1
          title: Subject
        body_text:
          anyOf:
            - type: string
            - type: "null"
          title: Body Text
        body_html:
          anyOf:
            - type: string
            - type: "null"
          title: Body Html
        conversation_id:
          anyOf:
            - type: string
              format: uuid
            - type: "null"
          title: Conversation Id
        metadata:
          additionalProperties: true
          type: object
          title: Metadata
      additionalProperties: false
      type: object
      required:
        - to
        - subject
      title: EmailCreate
    EmailListResponse:
      properties:
        items:
          items:
            $ref: "#/components/schemas/EmailSummary"
          type: array
          title: Items
        next_cursor:
          anyOf:
            - type: string
            - type: "null"
          title: Next Cursor
      type: object
      required:
        - items
      title: EmailListResponse
    EmailResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        organization_id:
          type: string
          format: uuid
          title: Organization Id
        conversation_id:
          anyOf:
            - type: string
              format: uuid
            - type: "null"
          title: Conversation Id
        sender_domain_id:
          type: string
          format: uuid
          title: Sender Domain Id
        from_address:
          type: string
          title: From Address
        to_addresses:
          items:
            type: string
          type: array
          title: To Addresses
        cc_addresses:
          anyOf:
            - items:
                type: string
              type: array
            - type: "null"
          title: Cc Addresses
        bcc_addresses:
          anyOf:
            - items:
                type: string
              type: array
            - type: "null"
          title: Bcc Addresses
        reply_to:
          anyOf:
            - type: string
            - type: "null"
          title: Reply To
        subject:
          type: string
          title: Subject
        status:
          type: string
          enum:
            - queued
            - sent
            - failed
            - bounced
            - complained
          title: Status
        end_reason:
          anyOf:
            - type: string
            - type: "null"
          title: End Reason
        provider_message_id:
          anyOf:
            - type: string
            - type: "null"
          title: Provider Message Id
        requested_at:
          type: string
          format: date-time
          title: Requested At
        sent_at:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
          title: Sent At
        failed_at:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
          title: Failed At
        metadata:
          additionalProperties: true
          type: object
          title: Metadata
        body_text:
          anyOf:
            - type: string
            - type: "null"
          title: Body Text
        body_html:
          anyOf:
            - type: string
            - type: "null"
          title: Body Html
      type: object
      required:
        - id
        - organization_id
        - conversation_id
        - sender_domain_id
        - from_address
        - to_addresses
        - cc_addresses
        - bcc_addresses
        - reply_to
        - subject
        - status
        - end_reason
        - provider_message_id
        - requested_at
        - sent_at
        - failed_at
        - body_text
        - body_html
      title: EmailResponse
    EmailSummary:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        organization_id:
          type: string
          format: uuid
          title: Organization Id
        conversation_id:
          anyOf:
            - type: string
              format: uuid
            - type: "null"
          title: Conversation Id
        sender_domain_id:
          type: string
          format: uuid
          title: Sender Domain Id
        from_address:
          type: string
          title: From Address
        to_addresses:
          items:
            type: string
          type: array
          title: To Addresses
        cc_addresses:
          anyOf:
            - items:
                type: string
              type: array
            - type: "null"
          title: Cc Addresses
        bcc_addresses:
          anyOf:
            - items:
                type: string
              type: array
            - type: "null"
          title: Bcc Addresses
        reply_to:
          anyOf:
            - type: string
            - type: "null"
          title: Reply To
        subject:
          type: string
          title: Subject
        status:
          type: string
          enum:
            - queued
            - sent
            - failed
            - bounced
            - complained
          title: Status
        end_reason:
          anyOf:
            - type: string
            - type: "null"
          title: End Reason
        provider_message_id:
          anyOf:
            - type: string
            - type: "null"
          title: Provider Message Id
        requested_at:
          type: string
          format: date-time
          title: Requested At
        sent_at:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
          title: Sent At
        failed_at:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
          title: Failed At
        metadata:
          additionalProperties: true
          type: object
          title: Metadata
      type: object
      required:
        - id
        - organization_id
        - conversation_id
        - sender_domain_id
        - from_address
        - to_addresses
        - cc_addresses
        - bcc_addresses
        - reply_to
        - subject
        - status
        - end_reason
        - provider_message_id
        - requested_at
        - sent_at
        - failed_at
      title: EmailSummary
      description:
        "Trimmed view for list endpoints \u2014 drops the message bodies.\n\
        \nBodies can be large and contain PII; paging through a year of mail\nshouldn't\
        \ return every byte of every message just to render a list.\nUse ``EmailResponse``\
        \ (via ``GET /emails/{id}``) for the full row."
    EventStreamResponse:
      properties:
        items:
          items:
            $ref: "#/components/schemas/CallEventResponse"
          type: array
          title: Items
        next_cursor:
          anyOf:
            - type: string
            - type: "null"
