[project]
name = "hailhq-voicebot"
version = "0.1.0"
description = "Hail voicebot service — deployed, not published."
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.11"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "hailhq-core",
    "asyncpg>=0.30",
    "numpy>=1.26",
    "sqlalchemy[asyncio]>=2.0",
    "livekit==1.1.20",
    "livekit-agents~=1.8.8",
    "livekit-plugins-openai~=1.8.8",
    "livekit-plugins-google~=1.8.8",
    "livekit-plugins-anthropic~=1.8.8",
    "livekit-plugins-deepgram~=1.8.8",
    "livekit-plugins-cartesia~=1.8.8",
    "livekit-plugins-elevenlabs~=1.8.8",
    "livekit-plugins-silero~=1.8.8",
    "livekit-plugins-speechmatics~=1.8.8",
    "livekit-plugins-noise-cancellation~=0.3.2",
    "pypdfium2>=5,<6",
    "pillow>=12",
]

[project.optional-dependencies]
# Non-default LiveKit Cloud input filters (HAIL_AUDIO_FILTER), large native wheels.
filters = [
    "livekit-plugins-krisp>=0.4.8",
    "livekit-plugins-ai-coustics>=0.2.12",
]
dev = [
    "pytest",
    "pytest-asyncio>=0.23",
    "ruff",
    "mypy",
    "testcontainers[postgres]>=4",
    "psycopg[binary]>=3.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Ship the hailhq namespace dir; the subpackage stays at hailhq/voicebot/...
packages = ["hailhq"]
dev-mode-dirs = ["."]

[tool.uv.sources]
hailhq-core = { workspace = true }
